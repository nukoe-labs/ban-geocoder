name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The call you made and the result you got.
      render: ts
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The ban-geocoder version or commit, and the Node.js or browser version.
    validations:
      required: true
  - type: input
    id: service
    attributes:
      label: Geocoding service
      description: The public IGN service, or the URL of your own Addok.
